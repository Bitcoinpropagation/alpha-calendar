<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史空投 - 币安 Alpha 空投日历</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent: #58a6ff;
            --accent-hover: #79c0ff;
            --border: #30363d;
            --success: #238636;
            --warning: #f0883e;
            --danger: #da3633;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        header {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .logo span {
            color: var(--accent);
        }
        
        nav {
            display: flex;
            gap: 8px;
        }
        
        nav a {
            color: var(--text-secondary);
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        
        nav a:hover, nav a.active {
            color: var(--text-primary);
            background-color: var(--bg-card);
        }
        
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px;
        }
        
        .section-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            font-size: 1.25rem;
            font-weight: 600;
        }
        
        .section-header i {
            color: var(--accent);
        }
        
        .table-container {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        
        th {
            background-color: var(--bg-card);
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            user-select: none;
        }
        
        th:hover {
            color: var(--text-primary);
        }
        
        th i {
            margin-left: 4px;
            font-size: 0.75rem;
        }
        
        td {
            font-size: 0.95rem;
        }
        
        tr:hover {
            background-color: rgba(88, 166, 255, 0.05);
        }
        
        .project-cell {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .project-token {
            font-weight: 600;
            color: var(--accent);
            text-decoration: none;
        }
        
        .project-token:hover {
            color: var(--accent-hover);
        }
        
        .project-name {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        .external-link {
            color: var(--text-secondary);
            text-decoration: none;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        
        .external-link:hover {
            opacity: 1;
            color: var(--accent);
        }
        
        .points {
            font-weight: 600;
        }
        
        .amount {
            color: var(--text-secondary);
        }
        
        .price {
            color: var(--success);
            font-weight: 500;
            text-decoration: none;
        }
        
        .price:hover {
            text-decoration: underline;
        }
        
        .mc {
            color: var(--text-secondary);
        }
        
        .date {
            color: var(--text-secondary);
        }
        
        .tag {
            display: inline-flex;
            align-items: center;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 8px;
        }
        
        .tag.tge {
            background-color: rgba(35, 134, 54, 0.2);
            color: var(--success);
        }
        
        .tag.pre-tge {
            background-color: rgba(240, 136, 62, 0.2);
            color: var(--warning);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        .loading i {
            animation: spin 1s linear infinite;
            font-size: 1.5rem;
            display: block;
            margin-bottom: 12px;
        }
        
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }
        
        footer {
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 24px 20px;
            margin-top: 48px;
        }
        
        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        
        .footer-links {
            display: flex;
            gap: 16px;
        }
        
        .footer-links a {
            color: var(--text-secondary);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            transition: color 0.2s;
        }
        
        .footer-links a:hover {
            color: var(--accent);
        }
        
        @media (max-width: 768px) {
            .nav-container {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 0;
            }
            
            nav {
                width: 100%;
                justify-content: center;
                margin-top: 12px;
            }
            
            th, td {
                padding: 10px 8px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="/" class="logo">
                <i class="bi bi-calendar-event"></i>
                <span>Alpha</span>历史空投
            </a>
            <nav>
                <a href="/">今日</a>
                <a href="/history.html" class="active">历史</a>
                <a href="/stability/">稳定度</a>
                <a href="/calendar/">记账</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="section-header">
            <i class="bi bi-archive"></i>
            历史空投
        </div>
        <div class="table-container">
            <table id="historyTable">
                <thead>
                    <tr>
                        <th>项目 <i class="bi bi-arrow-down-up"></i></th>
                        <th>积分</th>
                        <th>数量 <i class="bi bi-arrow-down-up"></i></th>
                        <th>MC <i class="bi bi-arrow-down-up"></i></th>
                        <th>日期</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="loading">
                            <i class="bi bi-arrow-repeat"></i>
                            加载中...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-links">
                <a href="https://alpha123.uk" target="_blank">
                    <i class="bi bi-globe"></i>
                    alpha123.uk
                </a>
                <a href="https://twitter.com/alpha123cc" target="_blank">
                    <i class="bi bi-twitter-x"></i>
                    𝕏
                </a>
                <a href="https://t.me/alpha123cn" target="_blank">
                    <i class="bi bi-telegram"></i>
                    Telegram通知
                </a>
            </div>
        </div>
    </footer>

    <script>
        const API_BASE = '/api';
        let historyData = [];
        let sortField = 'date';
        let sortDesc = true;
        
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        }
        
        function formatAmount(amount) {
            const num = parseFloat(amount);
            if (num >= 10000) {
                return (num / 10000).toFixed(1) + '万';
            }
            return amount;
        }
        
        function formatMC(mc) {
            if (!mc) return '-';
            const num = parseFloat(mc);
            if (num >= 1000000) {
                return (num / 1000000).toFixed(1) + 'M';
            } else if (num >= 1000) {
                return (num / 1000).toFixed(1) + 'K';
            }
            return mc;
        }
        
        async function fetchHistoryData() {
            try {
                const response = await fetch(`${API_BASE}/history`);
                if (response.ok) {
                    historyData = await response.json();
                } else {
                    historyData = [];
                }
                renderTable();
                
            } catch (error) {
                console.error('Error fetching history:', error);
                historyData = getMockHistoryData();
                renderTable();
            }
        }
        
        function getMockHistoryData() {
            // Sample historical data based on what we saw on the original site
            return [
                { token: 'EDGE', name: 'edgeX', points: 242, amount: '1.5万份', price: 66, priceUsd: 43.5, mc: '229.7M', date: '03-31' },
                { token: 'BASED', name: 'Based', points: 241, amount: '3.1万份', price: 320, priceUsd: 33.9, mc: '24.9M', date: '03-30' },
                { token: 'R2', name: 'R2 Protocol', points: 252, amount: '1.3万份', price: 750, priceUsd: 6.6, mc: '943.9K', date: '03-30' },
                { token: 'TRADOOR', name: 'TRADOOR', points: 242, amount: '1.7万份', price: 14, priceUsd: 42.2, mc: '43.1M', date: '03-26' },
                { token: 'PRL', name: 'Perle', points: 242, amount: '2.1万份', price: 485, priceUsd: 71.9, mc: '26.0M', date: '03-25', tag: 'TGE' },
                { token: 'AIA', name: 'AIA', points: 251, amount: '0.8万份', price: 335, priceUsd: 35.4, mc: '19.9M', date: '03-24' },
                { token: 'SIGMA', name: 'Sigma', points: 251, amount: '0.8万份', price: 375, priceUsd: 30.6, mc: '17.2M', date: '03-24' },
                { token: 'CYS', name: 'CYS', points: 240, amount: '1.7万份', price: 60, priceUsd: 20.0, mc: '54.8M', date: '03-20' },
                { token: 'IN', name: 'IN', points: 240, amount: '0.8万份', price: 470, priceUsd: 26.3, mc: '17.0M', date: '03-19' },
                { token: 'BLUAI', name: 'BLUAI', points: 240, amount: '0.8万份', price: 5000, priceUsd: 29.9, mc: '7.4M', date: '03-19' },
                { token: 'KAT', name: 'Katana', points: 241, amount: '1.5万份', price: 6814, priceUsd: 71.0, mc: '24.4M', date: '03-16', tag: 'Pre-TGE' },
                { token: 'UP', name: 'Unitas', points: 226, amount: '3.1万份', price: 327, priceUsd: 51.1, mc: '22.8M', date: '03-13', tag: 'TGE' },
                { token: 'SN3', name: 'Nebula3', points: 241, amount: '1万份', price: 1000, priceUsd: 1.0, mc: '353.6K', date: '03-11' },
                { token: 'LAB', name: 'LAB', points: 241, amount: '1.7万份', price: 207, priceUsd: 43.5, mc: '98.2M', date: '03-10' },
                { token: 'MAGMA', name: 'Magma Finance', points: 241, amount: '1.6万份', price: 320, priceUsd: 39.2, mc: '28.4M', date: '03-06' },
                { token: 'OPN', name: 'Opinion', points: 235, amount: '5万份', price: 100, priceUsd: 17.9, mc: '35.6M', date: '03-05' },
                { token: 'BSB', name: 'Block Street', points: 245, amount: '3.1万份', price: 320, priceUsd: 67.1, mc: '43.8M', date: '03-04' },
                { token: 'ROBO', name: 'Fabric Protocol', points: 240, amount: '3.3万份', price: 600, priceUsd: 13.0, mc: '50.0M', date: '03-04' },
                { token: 'LYN', name: 'LYN', points: 256, amount: '1.6万份', price: 95, priceUsd: 4.7, mc: '12.6M', date: '02-25' },
                { token: 'GUA', name: 'GUA', points: 256, amount: '1.6万份', price: 200, priceUsd: 77.8, mc: '85.5M', date: '02-24' },
            ];
        }
        
        function sortData(field) {
            if (sortField === field) {
                sortDesc = !sortDesc;
            } else {
                sortField = field;
                sortDesc = true;
            }
            renderTable();
        }
        
        function renderTable() {
            const tbody = document.querySelector('#historyTable tbody');
            
            // Sort data
            const sortedData = [...historyData].sort((a, b) => {
                let valA, valB;
                
                switch (sortField) {
                    case 'project':
                        valA = a.token;
                        valB = b.token;
                        break;
                    case 'amount':
                        valA = parseFloat(a.amount) || 0;
                        valB = parseFloat(b.amount) || 0;
                        break;
                    case 'mc':
                        valA = parseFloat(a.mc) || 0;
                        valB = parseFloat(b.mc) || 0;
                        break;
                    default:
                        valA = a.date;
                        valB = b.date;
                }
                
                if (valA < valB) return sortDesc ? 1 : -1;
                if (valA > valB) return sortDesc ? -1 : 1;
                return 0;
            });
            
            tbody.innerHTML = sortedData.map(item => `
                <tr>
                    <td>
                        <div class="project-cell">
                            <a href="#" class="project-token" onclick="showTokenInfo('${item.token}'); return false;">
                                ${item.token}
                            </a>
                            <a href="#" class="external-link" onclick="window.open('https://www.binance.com/en/price/${item.token.toLowerCase()}', '_blank'); return false;">
                                <i class="bi bi-box-arrow-up-right"></i>
                            </a>
                            <span class="project-name">${item.name}</span>
                        </div>
                    </td>
                    <td class="points">${item.points}</td>
                    <td>
                        <span class="amount">${formatAmount(item.amount)}</span>
                        ${item.price ? `<a href="#" class="price" onclick="showPriceInfo('${item.token}', ${item.price}); return false;">$${item.priceUsd}</a>` : ''}
                    </td>
                    <td class="mc">${item.mc}</td>
                    <td class="date">
                        ${item.date}
                        ${item.tag ? `<span class="tag ${item.tag.toLowerCase().replace('-', '-')}">${item.tag}</span>` : ''}
                    </td>
                    <td>
                        <button class="external-link" style="background: none; border: none; cursor: pointer;" onclick="showDetails('${item.token}')">
                            <i class="bi bi-journal-text"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
        
        function showTokenInfo(token) {
            console.log('Show info for:', token);
        }
        
        function showPriceInfo(token, price) {
            console.log('Show price info for:', token, price);
        }
        
        function showDetails(token) {
            console.log('Show details for:', token);
        }
        
        // Add click handlers for sortable headers
        document.addEventListener('DOMContentLoaded', () => {
            fetchHistoryData();
            
            const headers = document.querySelectorAll('th');
            headers.forEach((th, index) => {
                if (th.textContent.includes('项目')) {
                    th.addEventListener('click', () => sortData('project'));
                } else if (th.textContent.includes('数量')) {
                    th.addEventListener('click', () => sortData('amount'));
                } else if (th.textContent.includes('MC')) {
                    th.addEventListener('click', () => sortData('mc'));
                }
            });
        });
    </script>
</body>
</html>
